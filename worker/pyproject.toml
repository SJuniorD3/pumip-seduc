[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pumip-worker"
version = "2.0.0"
description = "Motor de Coleta e Sincronização em Camadas PUMIP-SEDUC"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SEDUC-MA STI / SUDES", email = "sudes@seduc.ma.gov.br" }
]
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.10.6",
    "pydantic-settings==2.8.0",
    "tenacity==9.0.0",
    "supabase==2.13.0",
    "cryptography==44.0.1",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "respx==0.22.0",
    "ruff==0.9.9",
    "mypy==1.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
