name: PUMIP Sincronização Horária (Worker)

on:
  schedule:
    # Executa a cada hora no minuto 17 (evita congestionamento no minuto zero do GitHub Actions)
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force_mode:
        description: 'Forçar sincronização de todos os processos (ignorar janela)'
        required: false
        type: boolean
        default: false

concurrency:
  group: pumip-worker-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Executar Motor de Coleta e Sincronização
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v7

      - name: Configurar Ambiente Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'worker/requirements.txt'

      - name: Instalar Dependências do Worker
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt

      - name: Executar Motor de Coleta PUMIP
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL || 'notificacoes@pumip.seduc.ma.gov.br' }}
          SEI_BASE_URL: ${{ secrets.SEI_BASE_URL }}
          SEI_USER: ${{ secrets.SEI_USER }}
          SEI_PASSWORD: ${{ secrets.SEI_PASSWORD }}
          STARTGOV_BASE_URL: ${{ secrets.STARTGOV_BASE_URL }}
          STARTGOV_USER: ${{ secrets.STARTGOV_USER }}
          STARTGOV_PASSWORD: ${{ secrets.STARTGOV_PASSWORD }}
          STARTGOV_API_TOKEN: ${{ secrets.STARTGOV_API_TOKEN }}
          STARTGOV_CLIENT_ID: ${{ secrets.STARTGOV_CLIENT_ID }}
          STARTGOV_CLIENT_SECRET: ${{ secrets.STARTGOV_CLIENT_SECRET }}
          APP_SECRET_ENCRYPTION_KEY: ${{ secrets.APP_SECRET_ENCRYPTION_KEY }}
          FORCE_MODE: ${{ inputs.force_mode || false }}
        run: |
          python worker/sync_engine.py
