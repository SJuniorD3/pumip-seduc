name: PUMIP-SEDUC CI (Qualidade & Testes)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  banco-ci:
    name: Banco Local, Migrações & Testes pgTAP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Iniciar Supabase Local
        run: supabase start

      - name: Resetar Banco e Aplicar Migrações + Seed
        run: supabase db reset

      - name: Executar Testes pgTAP no Banco
        run: supabase test db

  web-ci:
    name: Frontend Lint, Testes & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar Dependências
        run: npm ci

      - name: Verificação ESLint
        run: npm run lint

      - name: Verificação de Tipos TypeScript
        run: npx tsc --noEmit

      - name: Executar Testes Automatizados
        run: npm test

      - name: Compilação de Produção (Next.js Build)
        run: npm run build

  worker-ci:
    name: Worker Sintaxe & Dependências
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'worker/requirements.txt'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt

      - name: Validação de Sintaxe e Compilação
        run: |
          python -m py_compile worker/sync_engine.py
          python -m py_compile worker/pumip_worker/*.py worker/pumip_worker/fontes/*.py

      - name: Executar Testes Unitários e de Contrato (pytest)
        run: |
          PYTHONPATH=worker pytest worker/tests/
